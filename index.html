<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Usama Digital – Scale Your Business with Digital Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --bg:#fff;
  --bg2:#f4f7ff;
  --bg3:#eef1fb;
  --blue:#1a3fa8;
  --blue2:#2554cc;
  --blue3:#0d2a7a;
  --orange:#f47c20;
  --orange2:#ff9933;
  --orange3:#e06010;
  --white:#fff;
  --muted:#6b7a99;
  --card:#fff;
  --border:#d8e2ff;
  --green:#00b86b;
  --red:#FF3B3B;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--blue3);font-family:"DM Sans",sans-serif;overflow-x:hidden;}

/* ── ANIMATED ICONS RAIN ── */
.icons-rain{
  position:fixed;inset:0;
  pointer-events:none;z-index:0;overflow:hidden;
}
.rain-icon{
  position:absolute;top:-80px;
  opacity:0;
  animation:rainFall linear infinite;
}
.rain-icon.c-blue { color:rgba(26,63,168,0.11); }
.rain-icon.c-orange{ color:rgba(244,124,32,0.11); }
@keyframes rainFall{
  0%  {opacity:0;transform:translateY(0) rotate(0deg) scale(.7);}
  8%  {opacity:1;}
  90% {opacity:.85;}
  100%{opacity:0;transform:translateY(110vh) rotate(18deg) scale(1.05);}
}

/* ── OFFER BAR ── */
.offer-bar{
  background:linear-gradient(90deg,var(--blue3),var(--blue),var(--blue3));
  color:#fff;font-weight:700;font-size:.82rem;text-align:center;
  padding:10px 16px;z-index:200;position:relative;
  animation:barPulse 2.5s ease-in-out infinite;
}
@keyframes barPulse{0%,100%{opacity:1}50%{opacity:.85}}
.offer-bar .badge{
  background:var(--orange);color:#fff;
  padding:2px 10px;border-radius:20px;margin:0 8px;font-size:.72rem;
}
.cd{display:inline-flex;gap:5px;margin-left:8px;font-family:"Bebas Neue",sans-serif;font-size:1rem;}
.cd span{background:rgba(255,255,255,.18);color:var(--orange2);padding:2px 7px;border-radius:5px;}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5%;height:68px;transition:transform .3s;
  box-shadow:0 2px 20px rgba(26,63,168,0.07);
}
nav.hidden{transform:translateY(-110%);}
.logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-wrap img{height:48px;width:auto;}
.logo-text{
  font-family:"Bebas Neue",sans-serif;font-size:1.55rem;
  background:linear-gradient(135deg,var(--blue),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.06em;
}
.nav-links{display:flex;gap:26px;list-style:none;}
.nav-links a{
  color:var(--muted);text-decoration:none;font-size:.87rem;font-weight:500;
  transition:.2s;position:relative;
}
.nav-links a::after{
  content:"";position:absolute;bottom:-4px;left:0;
  width:0;height:2px;
  background:linear-gradient(90deg,var(--blue),var(--orange));
  transition:.25s;
}
.nav-links a:hover{color:var(--blue);}
.nav-links a:hover::after{width:100%;}
.nav-cta{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;font-weight:700;font-size:.84rem;
  padding:9px 20px;border-radius:8px;border:none;cursor:pointer;transition:.2s;white-space:nowrap;
}
.nav-cta:hover{opacity:.88;transform:scale(1.03);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;z-index:110;}
.hamburger span{display:block;width:24px;height:2px;background:var(--blue);transition:.3s;}

/* ── MOBILE MENU ── */
.menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:98;}
.menu-overlay.open{display:block;}
.mobile-menu{
  position:fixed;top:0;right:-100%;width:280px;height:100vh;
  background:#fff;z-index:999;border-left:1px solid var(--border);
  transition:right .35s ease;visibility:hidden;
}
.mobile-menu.open{right:0;visibility:visible;}
.mob-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);
}
.mob-header img{height:44px;width:auto;}
.close-btn{
  background:var(--bg2);border:2px solid var(--blue);color:var(--blue);
  width:44px;height:44px;border-radius:50%;font-size:1.3rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.close-btn:hover{background:var(--blue);color:#fff;}
.mobile-menu ul{list-style:none;padding:28px;display:flex;flex-direction:column;gap:22px;}
.mobile-menu ul a{color:var(--blue3);text-decoration:none;font-size:1.05rem;font-weight:600;}

/* ── SECTIONS ── */
section{padding:90px 6%;position:relative;z-index:1;}
.section-tag{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);margin-bottom:12px;font-weight:700;}
.section-title{font-family:"Bebas Neue",sans-serif;font-size:clamp(2rem,5vw,3.5rem);line-height:1.05;margin-bottom:14px;color:var(--blue3);}
.section-title .o{color:var(--orange);}
.section-sub{color:var(--muted);max-width:560px;line-height:1.72;margin-bottom:46px;font-size:.97rem;}
.divider{width:48px;height:3px;background:linear-gradient(90deg,var(--blue),var(--orange));margin:14px 0 38px;border-radius:2px;}
.center{text-align:center;}
.center .divider,.center .section-sub{margin-left:auto;margin-right:auto;}

/* ── HERO ── */
.hero{
  min-height:96vh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:100px 5% 80px;
  background:
    radial-gradient(ellipse 80% 65% at 50% 30%,rgba(26,63,168,0.06) 0%,transparent 65%),
    radial-gradient(ellipse 60% 50% at 80% 70%,rgba(244,124,32,0.07) 0%,transparent 60%),
    #ffffff;
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(26,63,168,0.06) 1px,transparent 1px);
  background-size:32px 32px;
}
.hero-inner{position:relative;z-index:1;max-width:780px;margin:0 auto;}

.hero-logo{display:flex;justify-content:center;margin-bottom:28px;animation:fadeUp .55s ease both;}
.hero-logo img{
  height:150px;width:auto;
  filter:drop-shadow(0 8px 32px rgba(26,63,168,0.18));
  transition:transform .4s;
}
.hero-logo img:hover{transform:scale(1.05) rotate(-1deg);}

.hero-tag{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);margin-bottom:22px;animation:fadeUp .6s .05s ease both;font-weight:700;}
.hero h1{
  font-family:"Bebas Neue",sans-serif;
  font-size:clamp(3rem,9vw,7rem);line-height:1.01;
  margin-bottom:24px;animation:fadeUp .7s .1s ease both;
}
.hero h1 .blue{color:var(--blue);}
.hero h1 .orange{color:var(--orange);}
.hero p{max-width:570px;margin:0 auto 36px;color:var(--muted);font-size:1.08rem;line-height:1.74;animation:fadeUp .8s .2s ease both;}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp .9s .3s ease both;}

.btn-primary{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;font-weight:700;
  padding:16px 36px;border-radius:10px;border:none;cursor:pointer;font-size:.97rem;
  box-shadow:0 0 30px rgba(26,63,168,0.32);transition:.2s;
  text-decoration:none;display:inline-block;
}
.btn-primary:hover{transform:scale(1.04);box-shadow:0 0 48px rgba(26,63,168,0.45);}
.btn-orange{
  background:linear-gradient(135deg,var(--orange3),var(--orange2));
  color:#fff;font-weight:700;
  padding:16px 36px;border-radius:10px;border:none;cursor:pointer;font-size:.97rem;
  box-shadow:0 0 30px rgba(244,124,32,0.32);transition:.2s;
  text-decoration:none;display:inline-flex;align-items:center;gap:9px;
}
.btn-orange:hover{transform:scale(1.04);box-shadow:0 0 48px rgba(244,124,32,0.45);}
.btn-wa{
  background:transparent;color:var(--blue);border:2px solid var(--blue);
  padding:14px 36px;border-radius:10px;cursor:pointer;font-size:.97rem;font-weight:600;
  display:inline-flex;align-items:center;gap:9px;transition:.2s;text-decoration:none;
}
.btn-wa:hover{background:var(--blue);color:#fff;}

/* ── TRUST BAR ── */
.trust-bar{
  background:linear-gradient(90deg,rgba(26,63,168,0.04),rgba(244,124,32,0.06),rgba(26,63,168,0.04));
  border-top:1px solid rgba(26,63,168,0.12);border-bottom:1px solid rgba(26,63,168,0.12);
  padding:20px 5%;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:28px;
  position:relative;z-index:1;
}
.trust-item{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--blue3);font-weight:600;}
.trust-item i{color:var(--orange);}
.trust-sep{color:rgba(26,63,168,0.2);font-size:1.2rem;}

/* ── SERVICES ── */
#services{background:var(--bg2);}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;}
.svc-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:28px 20px;transition:.25s;position:relative;overflow:hidden;
}
.svc-card::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(26,63,168,0.05),rgba(244,124,32,0.04));
  opacity:0;transition:.3s;
}
.svc-card:hover{border-color:var(--orange);transform:translateY(-5px);box-shadow:0 14px 44px rgba(26,63,168,0.12);}
.svc-card:hover::before{opacity:1;}
.svc-icon{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg,rgba(26,63,168,0.1),rgba(244,124,32,0.08));
  display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;color:var(--blue);margin-bottom:14px;
}
.svc-card:hover .svc-icon{color:var(--orange);}
.svc-title{font-weight:700;font-size:.9rem;margin-bottom:5px;color:var(--blue3);}
.svc-desc{font-size:.77rem;color:var(--muted);line-height:1.55;}

/* ── RESULTS ── */
#results{background:var(--bg3);}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.result-card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:30px 26px;display:flex;align-items:flex-start;gap:18px;transition:.25s;
}
.result-card:hover{border-color:var(--blue);box-shadow:0 0 32px rgba(26,63,168,0.1);}
.result-icon{font-size:2.2rem;flex-shrink:0;line-height:1;}
.result-title{font-weight:700;font-size:1rem;margin-bottom:7px;color:var(--blue3);}
.result-sub{font-size:.81rem;color:var(--muted);line-height:1.6;}

/* ── PACKAGES ── */
#packages{background:var(--bg2);}
.pkg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;}
.pkg-card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:36px 28px;position:relative;transition:.3s;
}
.pkg-card.popular{border-color:var(--orange);box-shadow:0 0 44px rgba(244,124,32,0.15);}
.pkg-badge{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--orange3),var(--orange2));
  color:#fff;font-weight:700;font-size:.71rem;
  padding:5px 18px;border-radius:20px;letter-spacing:.08em;white-space:nowrap;
}
.pkg-name{font-family:"Bebas Neue",sans-serif;font-size:1.45rem;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}
.pkg-price{
  font-family:"Bebas Neue",sans-serif;font-size:3.2rem;
  background:linear-gradient(135deg,var(--blue),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;
}
.pkg-price span{font-size:.95rem;color:var(--muted);font-family:"DM Sans",sans-serif;-webkit-text-fill-color:var(--muted);}
.pkg-desc{font-size:.8rem;color:var(--muted);margin:12px 0 22px;line-height:1.55;}
.pkg-features{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.pkg-features li{font-size:.83rem;display:flex;align-items:center;gap:10px;color:var(--blue3);}
.ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.62rem;flex-shrink:0;}
.ic.yes{background:rgba(26,63,168,0.12);color:var(--blue);}
.pkg-btn{width:100%;padding:13px;border-radius:10px;font-weight:700;font-size:.9rem;cursor:pointer;border:none;transition:.2s;}
.pkg-btn.gold{background:linear-gradient(135deg,var(--orange3),var(--orange2));color:#fff;}
.pkg-btn.blue-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;}
.pkg-btn.outline{background:transparent;border:1px solid var(--border);color:var(--blue3);}
.pkg-btn:hover{opacity:.88;transform:scale(1.02);}

/* ── WHY US ── */
#why{background:var(--bg3);}
.why-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;}
.why-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:30px 22px;text-align:center;transition:.25s;
}
.why-card:hover{border-color:var(--blue);transform:translateY(-4px);box-shadow:0 12px 36px rgba(26,63,168,0.1);}
.why-icon{font-size:2.2rem;margin-bottom:14px;}
.why-title{font-weight:700;font-size:.92rem;margin-bottom:7px;color:var(--blue3);}
.why-desc{font-size:.78rem;color:var(--muted);line-height:1.55;}

/* ── TESTIMONIALS ── */
#testimonials{background:var(--bg2);}
.testi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.testi-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;transition:.25s;}
.testi-card:hover{border-color:var(--orange);}
.stars{color:var(--orange);font-size:1rem;letter-spacing:2px;margin-bottom:14px;}
.testi-text{font-size:.87rem;color:var(--muted);line-height:1.74;margin-bottom:20px;font-style:italic;}
.testi-author{display:flex;align-items:center;gap:12px;}
.testi-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--orange));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:1rem;flex-shrink:0;
}
.testi-name{font-weight:700;font-size:.88rem;color:var(--blue3);}
.testi-role{font-size:.74rem;color:var(--muted);}

/* ── ORDER FORM ── */
#order{background:var(--bg3);}
.form-card{
  max-width:540px;margin:0 auto;
  background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 36px;
}
.form-group{margin-bottom:20px;}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:8px;letter-spacing:.05em;font-weight:600;}
input,select{
  width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--blue3);
  padding:13px 16px;border-radius:10px;font-size:.9rem;outline:none;
  transition:border-color .2s;font-family:"DM Sans",sans-serif;-webkit-appearance:none;
}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,63,168,0.08);}
select option{background:#fff;}
.submit-btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--blue),var(--orange));
  color:#fff;font-weight:700;font-size:1rem;border:none;border-radius:10px;cursor:pointer;transition:.2s;
  box-shadow:0 0 26px rgba(26,63,168,0.22);
}
.submit-btn:hover{transform:scale(1.02);box-shadow:0 0 44px rgba(26,63,168,0.35);}

/* ── FINAL CTA ── */
#final-cta{
  background:linear-gradient(135deg,var(--blue3) 0%,var(--blue) 55%,var(--blue2) 100%);
  text-align:center;padding:100px 6%;
  border-top:1px solid rgba(26,63,168,0.15);border-bottom:1px solid rgba(26,63,168,0.15);
  position:relative;overflow:hidden;
}
#final-cta::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,0.05) 1px,transparent 1px);
  background-size:32px 32px;
}
#final-cta h2{
  font-family:"Bebas Neue",sans-serif;font-size:clamp(2.4rem,7vw,5rem);
  color:#fff;margin-bottom:18px;position:relative;
}
#final-cta h2 span{color:var(--orange2);}
#final-cta p{color:rgba(255,255,255,.75);max-width:480px;margin:0 auto 40px;line-height:1.72;font-size:.97rem;position:relative;}
.cta-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;}

/* ── FOOTER ── */
footer{background:var(--blue3);color:#fff;border-top:1px solid rgba(255,255,255,0.1);padding:52px 6% 28px;}
.footer-top{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;margin-bottom:40px;}
.footer-brand p{font-size:.81rem;color:rgba(255,255,255,.55);max-width:240px;line-height:1.65;margin-top:10px;}
.footer-col h4{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:14px;}
.footer-col ul{list-style:none;display:flex;flex-direction:column;gap:8px;}
.footer-col ul li a{font-size:.82rem;color:rgba(255,255,255,.5);text-decoration:none;transition:.2s;}
.footer-col ul li a:hover{color:var(--orange2);}
.footer-contact p{font-size:.81rem;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.footer-contact p i{color:var(--orange2);}
.social-icons{display:flex;gap:12px;margin-top:16px;}
.social-icons a{
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.5);font-size:.9rem;text-decoration:none;transition:.2s;
}
.social-icons a:hover{border-color:var(--orange2);color:var(--orange2);}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;}
.footer-bottom p{font-size:.75rem;color:rgba(255,255,255,.35);}
.footer-logo{height:48px;width:auto;}

/* ── WHATSAPP ── */
.wa-btn{
  position:fixed;bottom:24px;right:24px;z-index:200;
  width:54px;height:54px;border-radius:50%;
  background:#25D366;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;color:#fff;text-decoration:none;
  box-shadow:0 4px 22px rgba(37,211,102,.5);
  animation:waPulse 2.5s ease-in-out infinite;
}
@keyframes waPulse{
  0%,100%{box-shadow:0 4px 20px rgba(37,211,102,.4),0 0 0 0 rgba(37,211,102,.3)}
  50%{box-shadow:0 4px 20px rgba(37,211,102,.4),0 0 0 12px rgba(37,211,102,0)}
}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease;}
.reveal.visible{opacity:1;transform:none;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .nav-links,.nav-cta{display:none;}
  .hamburger{display:flex;}
  section{padding:64px 5%;}
  .hero{min-height:auto;padding:80px 5% 60px;}
  .hero h1{font-size:clamp(2.5rem,12vw,4rem);}
  .hero-logo img{height:120px;}
  .hero-btns{flex-direction:column;align-items:center;}
  .btn-primary,.btn-orange,.btn-wa{width:100%;max-width:320px;justify-content:center;}
  .form-card{padding:28px 20px;}
}
</style>
</head>
<body>

<!-- ANIMATED ICONS RAIN -->
<div class="icons-rain" id="iconsRain"></div>

<!-- OFFER BAR -->
<div class="offer-bar">
  <span class="badge">LIMITED OFFER</span>
  🔥 10% OFF on all services — Expires in:
  <span class="cd"><span id="cdh">23</span>h <span id="cdm">59</span>m <span id="cds">47</span>s</span>
</div>

<!-- NAV -->
